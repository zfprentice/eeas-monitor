name: Update EEAS Statements

on:
  schedule:
    - cron: '0 * * * *'  # Runs automatically once an hour
  workflow_dispatch:        # Lets you click a button to run it immediately

permissions:
  contents: write
  issues: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug probe
        run: python debug_probe.py

      - name: Fetch statements
        id: fetch
        run: python scraper.py

      - name: Commit and push changes
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/statements.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update statements [skip ci]" && git push)

      - name: File or update failure issue
        if: failure() && steps.fetch.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🔴 Scraper is failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The hourly statements scraper failed. Every source returned zero items with no existing data to fall back on, which usually means a source's API or page markup changed again.\n\nSee the failed run: ${runUrl}`;

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = openIssues.data.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing as of this run.\n\n${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
