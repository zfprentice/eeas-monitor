<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EEAS Diplomatic Statements Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Header -->
    <header class="mb-8 border-b border-slate-800 pb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <div class="flex items-center gap-3">
          <span class="inline-block w-3 h-3 bg-blue-500 rounded-full animate-ping"></span>
          <h1 class="text-2xl font-bold tracking-tight text-white">EEAS Diplomatic Statements Monitor</h1>
        </div>
        <p class="text-slate-400 text-sm mt-1">Real-time diplomatic statements, declarations, and remarks from the EEAS and HR/VP.</p>
      </div>
      <div id="stats" class="text-xs bg-slate-800 px-3 py-1.5 rounded-md border border-slate-700 text-slate-300">
        Loading updates...
      </div>
    </header>

    <!-- Filters -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-6 bg-slate-800/60 p-4 rounded-xl border border-slate-800 backdrop-blur">
      <input type="text" id="searchInput" placeholder="Search keywords..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
      
      <select id="regionFilter" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        <option value="">All Regions</option>
      </select>

      <select id="typeFilter" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        <option value="">All Types</option>
      </select>

      <select id="sourceFilter" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        <option value="">All Sources</option>
        <option value="Commission PressCorner (HQ)">Commission PressCorner (HQ)</option>
        <option value="EEAS Direct Portal">EEAS Direct Portal</option>
      </select>
    </div>

    <!-- Feed Container -->
    <div id="feed" class="space-y-3">
      <div class="text-center py-16 text-slate-500">Loading live diplomatic feed...</div>
    </div>
  </div>

  <script>
    let statements = [];

    async function loadData() {
      try {
        const res = await fetch('./data/statements.json?v=' + Date.now());
        statements = await res.json();
        populateFilters();
        render();
        document.getElementById('stats').innerText = `${statements.length} items logged`;
      } catch (e) {
        document.getElementById('feed').innerHTML = `
          <div class="text-center py-16 text-slate-400">
            No statements ingested yet. Go to GitHub Actions and click <b>Run workflow</b>.
          </div>`;
      }
    }

    function populateFilters() {
      const regions = new Set();
      const types = new Set();

      statements.forEach(s => {
        (s.regions || []).forEach(r => regions.add(r));
        if (s.type) types.add(s.type);
      });

      const regSelect = document.getElementById('regionFilter');
      Array.from(regions).sort().forEach(r => {
        const opt = document.createElement('option');
        opt.value = r; opt.innerText = r;
        regSelect.appendChild(opt);
      });

      const typeSelect = document.getElementById('typeFilter');
      Array.from(types).sort().forEach(t => {
        const opt = document.createElement('option');
        opt.value = t; opt.innerText = t;
        typeSelect.appendChild(opt);
      });
    }

    function render() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const selectedReg = document.getElementById('regionFilter').value;
      const selectedType = document.getElementById('typeFilter').value;
      const selectedSource = document.getElementById('sourceFilter').value;

      const filtered = statements.filter(item => {
        const matchesQuery = !q || (item.title + ' ' + (item.summary || '') + ' ' + item.speaker).toLowerCase().includes(q);
        const matchesReg = !selectedReg || (item.regions && item.regions.includes(selectedReg));
        const matchesType = !selectedType || item.type === selectedType;
        const matchesSource = !selectedSource || item.source === selectedSource;
        return matchesQuery && matchesReg && matchesType && matchesSource;
      });

      const container = document.getElementById('feed');
      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-16 text-slate-500">No matching statements found.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <article class="p-5 rounded-lg bg-slate-800/40 hover:bg-slate-800/70 border border-slate-700/60 transition-all flex flex-col justify-between">
          <div>
            <div class="flex flex-wrap items-center gap-2 mb-2 text-xs">
              <span class="bg-blue-900/60 text-blue-300 px-2 py-0.5 rounded border border-blue-700/50 font-medium">${item.type || 'STATEMENT'}</span>
              ${(item.regions || []).map(r => `<span class="bg-slate-700 text-slate-300 px-2 py-0.5 rounded">${r}</span>`).join('')}
              <span class="text-slate-400 ml-auto">${item.date || ''}</span>
            </div>
            <a href="${item.link}" target="_blank" rel="noopener" class="text-base font-semibold text-slate-100 hover:text-blue-400 transition-colors inline-block mb-1.5">
              ${item.title} ↗
            </a>
            ${item.summary ? `<p class="text-xs text-slate-400 line-clamp-2 mb-3">${item.summary}</p>` : ''}
          </div>
          <div class="flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-slate-800">
            <span>🗣️ ${item.speaker || 'EEAS Spokesperson'}</span>
            <span class="text-slate-500">${item.source}</span>
          </div>
        </article>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('regionFilter').addEventListener('change', render);
    document.getElementById('typeFilter').addEventListener('change', render);
    document.getElementById('sourceFilter').addEventListener('change', render);

    loadData();
  </script>
</body>
</html>
