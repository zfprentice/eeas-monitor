name: Update EEAS Statements

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs automatically every 30 minutes
  workflow_dispatch:        # Lets you click a button to run it immediately

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch statements
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/statements.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update statements [skip ci]" && git push)
